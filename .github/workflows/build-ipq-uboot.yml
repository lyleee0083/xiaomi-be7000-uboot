name: Build Xiaomi BE7000 U-Boot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ARTIFACT_VERSION: '0.0.5'
  APT_SNAPSHOT: '20261118T000000Z'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.15.0'

      - name: Install build dependencies
        run: |
          sudo apt-get --snapshot "$APT_SNAPSHOT" update -qq
          sudo apt-get --snapshot "$APT_SNAPSHOT" install -y build-essential libncurses-dev gawk git gettext libssl-dev python3 wget cpio flex bison bc rsync gzip zopfli device-tree-compiler

      - name: Install Webfailsafe minification tools
        run: npm ci --prefix failsafe/html --ignore-scripts --no-audit --no-fund

      - name: Fetch the ARM OpenWrt toolchain
        run: |
          git init ../staging_dir
          git -C ../staging_dir fetch --no-tags --depth=1 https://github.com/1980490718/toolchain-arm_cortex-a7_gcc-5.2.0.git 0daf0879219130c46812cd5029fbcc2940316b16
          git -C ../staging_dir checkout --detach FETCH_HEAD

      - name: Build Xiaomi BE7000 U-Boot
        run: ./build.sh ipq9574_xiaomi_be7000

      - name: Record ART/MAC symbol addresses
        run: |
          awk '$1 ~ /^0x[[:xdigit:]]+$/ && $2 ~ /^(__rel_dyn_start|__rel_dyn_end|macaddr_(read|modify)_(base|wifi)|macaddr_wifi_(offset|cs_offset|checksum|cs_valid)|memalign|free|macaddr_restore_art_image|mtd_(read|write|erase|block_isbad)|smem_getpart|qca_smem_flash_info|nand_info)$/ { print $1, $2 }' u-boot.map

      - name: Add the build version to the MBN filename
        shell: bash
        run: |
          if [[ ! "$ARTIFACT_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'Invalid artifact version: %s\n' "$ARTIFACT_VERSION" >&2
            exit 1
          fi
          mv -- bin/openwrt-ipq9574_xiaomi_be7000-u-boot.mbn \
            "bin/openwrt-ipq9574_xiaomi_be7000-u-boot-${ARTIFACT_VERSION}.mbn"

      - name: Upload the BE7000 MBN image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: bin/openwrt-ipq9574_xiaomi_be7000-u-boot-${{ env.ARTIFACT_VERSION }}.mbn
          if-no-files-found: error
          archive: false
          retention-days: 30
