name: Build Xiaomi BE7000 U-Boot

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  ARTIFACT_VERSION: '0.0.1'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential libncurses-dev gawk git gettext libssl-dev python3 wget cpio flex bison bc rsync gzip zopfli device-tree-compiler

      - name: Install Webfailsafe minification tools
        run: |
          npm install --global \
            html-minifier-terser@7.2.0 \
            clean-css@5.3.3 \
            terser@5.51.2 \
            svgo@4.1.0
          export NODE_PATH="$(npm root --global)"
          node -e 'for (const name of ["html-minifier-terser","clean-css","terser","svgo"]) {
            require(name);
            console.log(`${name}: ${require.resolve(name)}`);
          }'
          printf 'NODE_PATH=%s\n' "$NODE_PATH" >> "$GITHUB_ENV"

      - name: Fetch the ARM OpenWrt toolchain
        run: git clone --depth=1 https://github.com/1980490718/toolchain-arm_cortex-a7_gcc-5.2.0.git ../staging_dir

      - name: Build Xiaomi BE7000 U-Boot
        run: ./build.sh ipq9574_xiaomi_be7000

      - name: Record ART/MAC symbol addresses
        run: |
          awk '$1 ~ /^0x[[:xdigit:]]+$/ && $2 ~ /^(__rel_dyn_start|__rel_dyn_end|macaddr_(read|modify)_(base|wifi)|macaddr_wifi_(offset|cs_offset|checksum|cs_valid)|memalign|free|mtd_(read|write|erase)|smem_getpart|qca_smem_flash_info|nand_info)$/ { print $1, $2 }' u-boot.map

      - name: Add the build version to the MBN filename
        shell: bash
        run: |
          if [[ ! "$ARTIFACT_VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            printf 'Invalid artifact version: %s\n' "$ARTIFACT_VERSION" >&2
            exit 1
          fi
          mv -- bin/openwrt-ipq9574_xiaomi_be7000-u-boot.mbn \
            "bin/openwrt-ipq9574_xiaomi_be7000-u-boot-${ARTIFACT_VERSION}.mbn"

      - name: Upload the BE7000 MBN image
        uses: actions/upload-artifact@v7.0.1
        with:
          path: bin/openwrt-ipq9574_xiaomi_be7000-u-boot-${{ env.ARTIFACT_VERSION }}.mbn
          if-no-files-found: error
          archive: false
          retention-days: 30
